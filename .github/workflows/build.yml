
name: Build Pizza Creator 2D APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter Android project
        run: flutter create --platforms=android --org com.pizzacreator build_app

      - name: Install dependencies
        working-directory: build_app
        run: flutter pub get

      - name: Copy game source
        run: cp main.dart build_app/lib/main.dart

      - name: Build release APK
        working-directory: build_app
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pizza-creator-2d-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
